trigger:
- main

pool:
  name: Default

steps:
- checkout: self
  clean: true

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

# (Optional) To ensure server runs properly
- script: |
    node server-azure.js
  displayName: 'Start server for testing'


